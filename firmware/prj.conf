# The Adafruit bootloader takes UF2 files; the base board variant does not emit one by itself.
CONFIG_BUILD_OUTPUT_UF2=y

CONFIG_GPIO=y
CONFIG_COMPARATOR=y
CONFIG_ADC=y
# sys_reboot() for the BLE bootloader command.
CONFIG_REBOOT=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="Intercom-BLE"
# nRF52840 ceiling.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Release build: no USB. The board's CDC ACM console enables USB at boot, and
# the nRF USB driver then holds the 32 MHz crystal even on battery. debug.conf
# turns it back on for the bench.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USB_DEVICE_STACK_NEXT=n

# This board has the 32 kHz crystal. On one without it bt_enable() never
# returns with XTAL selected; switch to CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y

# A fatal error (fault, stack overflow, controller assert) otherwise halts the
# CPU for good, adverts included. Boot mode is NONE and HA re-sends its mode.
CONFIG_RESET_ON_FATAL_ERROR=y
